[workspace]
members = ["."]

[package]
name = "bluetooth-tui"
version = "0.1.0"
edition = "2024"

[lib]
name = "bluetooth_tui"
path = "src/lib.rs"

[[bin]]
name = "bluetooth-tui"
path = "src/bin/main.rs"

[dependencies]
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Fast iteration: keep our own crate unoptimized (cheap to recompile),
# but build dependencies at opt-level 3 once and reuse them.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

# Fastest runtime binary: full LTO + single codegen unit, no unwinding
# machinery, symbols stripped. Release builds will be slower to compile.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
