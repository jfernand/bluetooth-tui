[package]
name = "bluetooth-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A terminal UI for exploring and managing Bluetooth devices via BlueZ, like bluetoothctl with a screen"
readme = "../../README.md"
keywords = ["bluetooth", "tui", "bluez", "cli"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1.0.104"
bluetooth-driver = { path = "../bluetooth-driver", version = "0.2.0" }
bluetooth-tui-core = { path = "../bluetooth-tui-core", version = "0.2.0" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
