[package]
name = "bluetooth-tui-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bluetooth-driver = { path = "../bluetooth-driver" }
futures-util = "0.3.34"

# "wasm-bindgen" feature required: without it, futures-timer's Delay
# silently falls back to its `native` module even on wasm32 (it's
# gated on the feature, not just target_arch), and that module calls
# std::time::Instant::now() - the exact same "time not implemented on
# this platform" panic web-time was added to fix, just from here
# instead. Harmless on native: the feature only pulls in the
# gloo-timers/send_wrapper deps it needs under a
# cfg(target_arch = "wasm32") target dependency in futures-timer's own
# Cargo.toml, so it's a no-op there regardless.
futures-timer = { version = "3.0", features = ["wasm-bindgen"] }

# std::time::Instant::now() panics unconditionally on wasm32-unknown-
# unknown - that target has no clock backend at all in std. web-time
# is API-compatible with std::time::{Instant, SystemTime}: on native it
# just re-exports std's, on wasm32 it's backed by Performance.now().
web-time = "1.1.0"

# default-features = false, dropping just "crossterm" from ratatui's
# own defaults: this crate is shared with a wasm32 frontend (see
# key.rs's doc comment), and ratatui's "crossterm" feature pulls in the
# crossterm crate, which doesn't compile on wasm32 at all. The native
# frontend still gets it - its own Cargo.toml requests defaults, and
# Cargo unifies features across that build's dependency graph.
[dependencies.ratatui]
version = "0.30.2"
default-features = false
features = ["all-widgets", "layout-cache", "macros", "underline-color", "std"]
