<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Bluetooth Explorer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            height: 100%;
            overflow: hidden;
        }
        body {
            /* ratzilla's DomBackend measures a cell's pixel width via
               CSS `1ch` in whatever font this page inherits, then lays
               out one <span> per character using that measurement. In
               a proportional font, `1ch` (the "0" glyph's width) and a
               given character's actual rendered width disagree, so the
               grid math is wrong throughout - cells drift out of
               alignment and the rendered grid overflows the window.
               A monospace font is required, not just a style choice. */
            font-family: ui-monospace, "Cascadia Code", "Fira Code", Menlo, Consolas, monospace;
        }
        /* Each terminal row is a bare <pre> with only `height` set
           inline - it still carries the browser's default UA
           stylesheet margin (`margin: 1em 0`, ~13px here). Adjacent
           rows collapse that into ~13px of extra space *between* them,
           nearly doubling the real height of every row versus what
           DomBackend measured and sized the grid for - the whole
           terminal ends up roughly twice as tall as the viewport, with
           everything past the halfway point (including the footer)
           pushed below the fold. */
        #grid pre {
            margin: 0;
        }
    </style>
    <link data-trunk rel="rust" data-bin="bluetooth-tui-web" />
</head>
<body></body>
</html>
